name: Release Verification

on:
  push:
    branches:
      - dev
      - master
      - "release/**"
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: solver/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install solver dependencies
        run: pip install -r solver/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: mvn test

      - name: Run solver tests
        working-directory: solver
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run frontend syntax check
        run: node --check backend/src/main/resources/static/app.js
